# OpenRelay — model registry.
# Add any model, any endpoint, any key. ${ENV} is expanded at load so keys
# never sit in this file. Entries with the same `name` act as failover chain.
#
# `provider` selects the request format (default "openai" = OpenAI-compatible):
#   openai     DeepSeek, Groq, Together, OpenRouter, Mistral, xAI, Ollama,
#              vLLM, llama.cpp, LM Studio, and any OpenAI-compatible host
#   anthropic  native Anthropic /v1/messages
#   gemini     native Google /v1beta/models/...:generateContent

models:
  # --- self-hosted uncensored weights (forward raw, nothing injected) ---
  - name: local-uncensored
    base_url: http://localhost:11434/v1        # Ollama / vLLM / llama.cpp / LM Studio
    api_key: ollama                             # local servers ignore this
    model: dolphin-mistral                      # abliterated/uncensored weight
    uncensored: true

  # --- DeepSeek (OpenAI-compatible, persona-injected) ---
  - name: deepseek
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    model: deepseek-chat

  # --- any hosted OpenAI-compatible API behind a persona layer ---
  - name: openai
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    model: gpt-4o

  # --- native Anthropic (Claude) ---
  - name: claude
    base_url: https://api.anthropic.com
    api_key: ${ANTHROPIC_API_KEY}
    model: claude-sonnet-4
    provider: anthropic

  # --- native Google Gemini ---
  - name: gemini
    base_url: https://generativelanguage.googleapis.com
    api_key: ${GEMINI_API_KEY}
    model: gemini-2.0-flash
    provider: gemini

  # --- any OpenAI-compatible provider: Groq, Together, OpenRouter, ... ---
  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    model: openai/gpt-4o                        # or any model slug on the provider

  # failover example: two endpoints, same name -> second answers if first errors
  - name: primary
    base_url: https://api.groq.com/openai/v1
    api_key: ${GROQ_API_KEY}
    model: llama-3.3-70b-versatile
  - name: primary
    base_url: http://localhost:11434/v1
    api_key: ollama
    model: dolphin-mistral
    uncensored: true
